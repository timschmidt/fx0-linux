%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx179.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX179 8Mpixel CMOS Digital Image Sensor

maintainers:
  - Timothy Schmidt <timschmidt@gmail.com>

description:
  The Sony IMX179 is a CMOS active pixel digital image sensor with an active
  array size of 3280H x 2464V. It is programmable through I2C at address 0x10
  and sends image data through four MIPI CSI-2 data lanes.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx179

  reg:
    maxItems: 1

  clocks:
    description: Input clock, 24 MHz.
    maxItems: 1

  dovdd-supply:
    description: Digital I/O voltage supply, 1.8 volts.

  avdd-supply:
    description: Analogue voltage supply, 2.8 volts.

  dvdd-supply:
    description: Digital core voltage supply, 1.2 volts.

  reset-gpios:
    maxItems: 1
    description: Reference to the GPIO connected to the XCLR pin.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies: true

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - dovdd-supply
  - avdd-supply
  - dvdd-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        sensor@10 {
            compatible = "sony,imx179";
            reg = <0x10>;
            clocks = <&cam_mclk0>;
            dovdd-supply = <&vreg_1v8>;
            avdd-supply = <&vreg_2v8>;
            dvdd-supply = <&vreg_1v2>;
            reset-gpios = <&tlmm 114 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&csiphy0_ep>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <324000000>;
                };
            };
        };
    };
...
